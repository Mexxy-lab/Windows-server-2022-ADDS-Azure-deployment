---
- name: Join Windows client to the AD domain
  hosts: windows_clients
  gather_facts: false

  vars_files:
    - ../group_vars/windows.yml
    - ../group_vars/vault.yml

  vars:
    # The deployment script supplies the appropriate WinRM password.
    # Azure uses the local labadmin bootstrap password.
    # AWS can supply its configured client connection credentials.
    ansible_password: "{{ domain_admin_password }}"

    # AWS default. Azure overrides this with labadmin@pumejlab.com.
    domain_admin_user: "Administrator@{{ domain_name }}"

  tasks:
    # ---------------------------------------------------------
    # 1. Configure the Windows client to use the domain
    #    controller as its DNS server.
    # ---------------------------------------------------------
    - name: Configure the domain controller as DNS server
      ansible.windows.win_dns_client:
        adapter_names: "*"
        dns_servers:
          - "{{ domain_dns_server }}"

    # ---------------------------------------------------------
    # 2. Join the Windows client to Active Directory.
    #    Use UPN format to avoid backslash escaping issues.
    # ---------------------------------------------------------
    - name: Join the Active Directory domain
      microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ domain_admin_user }}"
        domain_admin_password: "{{ domain_admin_password }}"
        state: domain
      register: domain_join
      no_log: true

    # ---------------------------------------------------------
    # 3. Verify that the client belongs to the expected domain.
    # ---------------------------------------------------------
    - name: Verify that the client is configured to join the expected domain
      ansible.windows.win_powershell:
        script: |
          $computer = Get-CimInstance Win32_ComputerSystem

          if (-not $computer.PartOfDomain) {
              throw "The client is not joined to an Active Directory domain."
          }

          if ($computer.Domain -ne "{{ domain_name }}") {
              throw "The client is joined to an unexpected domain: $($computer.Domain)"
          }

          Write-Output "Successfully joined domain: $($computer.Domain)"

    # ---------------------------------------------------------
    # 4. Display confirmation.
    #    The AWS deployment script handles the Windows reboot
    #    through Systems Manager (SSM), not Ansible WinRM.
    # ---------------------------------------------------------
    - name: Confirm successful domain join
      ansible.builtin.debug:
        msg:
          - "Windows client successfully joined {{ domain_name }}."
          - "Domain membership verification completed."
          - "The deployment script will handle the client reboot through AWS SSM/Azure-Winrm."
