---
- name: Prepare and promote the domain controller
  hosts: domain_controller
  gather_facts: false

  vars_files:
    - ../group_vars/windows.yml
    - ../group_vars/vault.yml

  vars:
    # The deployment script supplies the platform-specific WinRM credentials.
    # AWS can use its local Administrator account.
    # Azure uses its local labadmin account.
    # After AD DS promotion, the script switches to domain Administrator.
    ansible_password: "{{ domain_admin_password }}"

  tasks:
    # Ensure the server has the intended hostname before creating the forest.
    - name: Set the domain controller hostname
      ansible.windows.win_hostname:
        name: "{{ domain_controller_hostname }}"
      register: hostname_change

    # A hostname change requires a reboot before AD DS promotion.
    - name: Reboot after hostname change
      ansible.windows.win_reboot:
        reboot_timeout: 1800
        msg: "Rebooting to apply the domain controller hostname."
      when: hostname_change.reboot_required

    # Install Active Directory Domain Services and management tools.
    - name: Install AD DS and management tools
      ansible.windows.win_feature:
        name: AD-Domain-Services
        state: present
        include_management_tools: true
      register: adds_install

    # Create the new AD forest without immediately rebooting.
    # The deployment script will perform the reboot through SSM.
    - name: Configure the new AD forest
      ansible.windows.win_powershell:
        script: |
          param(
            [string]$DomainName,
            [string]$DomainNetBIOSName,
            [string]$DsrmPassword
          )

          $computer = Get-CimInstance Win32_ComputerSystem

          if (-not $computer.PartOfDomain) {
            $securePassword = ConvertTo-SecureString `
              $DsrmPassword -AsPlainText -Force

            Install-ADDSForest `
              -DomainName $DomainName `
              -DomainNetBIOSName $DomainNetBIOSName `
              -InstallDNS `
              -SafeModeAdministratorPassword $securePassword `
              -NoRebootOnCompletion `
              -Force

            $Ansible.Changed = $true
          }
        parameters:
          DomainName: "{{ domain_name }}"
          DomainNetBIOSName: "{{ domain_netbios_name }}"
          DsrmPassword: "{{ dsrm_password }}"
      register: forest_install
      no_log: true
